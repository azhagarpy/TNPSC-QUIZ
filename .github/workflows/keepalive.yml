name: Keep Supabase awake

# Free Supabase projects pause after 7 idle days. A light read every 3 days
# keeps the project up during quiet weeks.
#
# Secrets: SUPABASE_URL, SUPABASE_ANON_KEY

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one public row
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error "$URL/rest/v1/units?select=key&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
